# r9700-tunerd — ASUS Radeon AI PRO R9700 32GB
# Identity is vendor/device/subsystem, never a PCI slot.

VENDOR=0x1002
DEVICE=0x7551
SUBSYSTEM_VENDOR=0x1043
SUBSYSTEM_DEVICE=0x0626

# Power cap in watts. Validated against live power1_cap_min/max at apply time.
POWER_LIMIT_W=210

# RDNA4 VDDGFX offset. Default 0. Range is live-validated (typically -200..0).
# Step in -25 mV increments after Phase B is proven. Do not jump to -200.
VOLTAGE_OFFSET_MV=0

# runtime_status poll while watching. Proven not to wake the device.
POLL_INTERVAL_S=2

# EVICT_GUARD: Enable (1) or disable (0) the eviction guard (default 1).
# When enabled, the daemon monitors VRAM usage and holds the GPU awake
# if VRAM exceeds the margin threshold of GTT total. This prevents system
# freezes when GPU workloads (e.g. LLM inference) occupy more VRAM than the
# Graphics Translation Table can absorb during D3cold eviction.
EVICT_GUARD=1

# EVICT_GUARD_MARGIN: Fraction of GTT at which the guard triggers (default 0.90 = 90%).
# The release threshold is 80% of this value to prevent flapping.
EVICT_GUARD_MARGIN=0.90

# Custom fan curve (R0.2). Active-only controller with firmware fallback
# on every exit path (see docs/ARCHITECTURE.md). FAN_CURVE is a
# temp:pwm point list (temp in C 0..110, pwm in % 0..100), at least two
# points, strictly increasing temps, non-decreasing pwm. Hysteresis
# applies on the way down only (default 3C): the fan speed only drops
# once temp falls FAN_HYSTERESIS_C below the point that raised it.
FAN_CURVE=40:0,55:30,70:55,85:100
FAN_CURVE_ENABLED=0
FAN_HYSTERESIS_C=3
