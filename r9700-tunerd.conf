# r9700-tunerd — ASUS Radeon AI PRO R9700 32GB
# Identity is vendor/device/subsystem, never a PCI slot.

VENDOR=0x1002
DEVICE=0x7551
SUBSYSTEM_VENDOR=0x1043
SUBSYSTEM_DEVICE=0x0626

# Power cap in watts. Validated against live power1_cap_min/max at apply time.
POWER_LIMIT_W=210

# RDNA4 VDDGFX offset. Default 0. Range is live-validated (typically -200..0).
# Step in -25 mV increments after Phase B is proven. Do not jump to -200.
VOLTAGE_OFFSET_MV=0

# runtime_status poll while watching. Proven not to wake the device.
POLL_INTERVAL_S=2

# Phase D (not implemented yet) — active-only fan state machine:
# FAN_CONTROL=0
# FAN_MANUAL_ENTER_TEMP=60
# FAN_AUTO_RETURN_TEMP=50
# FAN_POINT_1=55:30
# FAN_POINT_2=65:35
# FAN_POINT_3=75:45
# FAN_POINT_4=85:60
# FAN_POINT_5=95:80
