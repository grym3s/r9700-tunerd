# r9700-tunerd — ASUS Radeon AI PRO R9700 32GB
# Identity is vendor/device/subsystem, never a PCI slot.

VENDOR=0x1002
DEVICE=0x7551
SUBSYSTEM_VENDOR=0x1043
SUBSYSTEM_DEVICE=0x0626

# Power cap in watts. Validated against live power1_cap_min/max at apply time.
POWER_LIMIT_W=210

# RDNA4 VDDGFX offset. Default 0. Range is live-validated (typically -200..0).
# Step in -25 mV increments after Phase B is proven. Do not jump to -200.
VOLTAGE_OFFSET_MV=0

# runtime_status poll while watching. Proven not to wake the device.
POLL_INTERVAL_S=2

# EVICT_GUARD: Enable (1) or disable (0) the eviction guard (default 1).
# When enabled, the daemon monitors VRAM usage and holds the GPU awake
# if VRAM exceeds the margin threshold of GTT total. This prevents system
# freezes when GPU workloads (e.g. LLM inference) occupy more VRAM than the
# Graphics Translation Table can absorb during D3cold eviction.
EVICT_GUARD=1

# EVICT_GUARD_MARGIN: Fraction of GTT at which the guard triggers (default 0.90 = 90%).
# The release threshold is 80% of this value to prevent flapping.
EVICT_GUARD_MARGIN=0.90

# Phase 5 (delivered, pending hardware acceptance) — tuning profiles:
# PROFILE: Active profile name (EFFICIENCY, BALANCED, PERFORMANCE, or CUSTOM).
# Default: CUSTOM. Resolves to an offset/cap pair via set-profile; set-tuning flips
# PROFILE to CUSTOM and preserves the new offset/cap. Profiles are immutable and
# derived from offline characterisation. Safe to run anytime (unprivileged).
# PROFILE=BALANCED

# Phase 6 (delivered, pending hardware acceptance) — custom fan curve:
# FAN_CURVE_ENABLED: Enable (1) or disable (0) the custom fan curve (default 0).
# When enabled, the daemon actively controls GPU fans via firmware PWM only while
# the GPU is runtime_active. On every exit path (normal shutdown, daemon crash,
# driver rebind, GPU reset) the firmware fallback is restored (firmware auto mode,
# allowing 0 RPM on idle). Hysteresis prevents flapping near curve points.
# FAN_CURVE_ENABLED=0

# FAN_HYSTERESIS_C: Hysteresis band in degrees Celsius (default 2).
# Temperature must rise/fall past a point by this much before the PWM changes,
# preventing oscillation when temperature hovers at a curve boundary.
# FAN_HYSTERESIS_C=2

# Fan curve points (temperature in °C, PWM duty in %). Linear interpolation
# between points; edges clamped. E.g. FAN_POINT_1=55:30 means 30% PWM at 55°C.
# Firmware limits the absolute PWM range; invalid points are rejected at apply time.
# FAN_POINT_1=55:30
# FAN_POINT_2=65:40
# FAN_POINT_3=75:50
# FAN_POINT_4=85:70
# FAN_POINT_5=95:90
